<!DOCTYPE html>
<html lang="en">

<body>

        <div>

        <select>

        </select>

        <button>

        </button>
    </div>

    <!-- Language -->
    <div class="language">
        <img src="amarican flag.png" alt="English">

    </div>

    </div>

    <div class="cart">
        <img src="cart.png" alt="Cart">

    </div>
    

</header>
